services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgis/postgis:16-3.4
    container_name: safarpay-postgres
    environment:
      POSTGRES_DB: safarpay_db
      POSTGRES_USER: safarpay
      POSTGRES_PASSWORD: safarpay_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safarpay -d safarpay_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safarpay-net

  redis:
    image: redis:7-alpine
    container_name: safarpay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safarpay-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: safarpay-kafka
    environment:
      # KRaft mode — native Apache configuration names
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - safarpay-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: safarpay-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@safarpay.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - safarpay-net

  # ── Database migrations (runs once, then exits) ────────────────────────────

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: safarpay-migrate
    environment:
      POSTGRES_DB_URI: postgresql+psycopg://safarpay:safarpay_secret@postgres:5432/safarpay_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safarpay-net
    restart: "no"

  # ── Microservices ───────────────────────────────────────────────────────────

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    container_name: safarpay-gateway
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB_URI: postgresql+psycopg://safarpay:safarpay_secret@postgres:5432/safarpay_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      APP_NAME: safarpay
      LOG_LEVEL: INFO
      AUTH_SERVICE_URL: http://auth:8000
      BIDDING_SERVICE_URL: http://bidding:8000
      LOCATION_SERVICE_URL: http://location:8000
      NOTIFICATION_SERVICE_URL: http://notification:8000
      VERIFICATION_SERVICE_URL: http://verification:8000
      GEOSPATIAL_SERVICE_URL: http://geospatial:8000
      COMMUNICATION_SERVICE_URL: http://communication:8000
      RIDE_SERVICE_URL: http://ride:8000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - safarpay-net

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth
    container_name: safarpay-auth
    ports:
      - "8001:8000"
    environment:
      POSTGRES_DB_URI: postgresql+psycopg://safarpay:safarpay_secret@postgres:5432/safarpay_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: "24"
      AUTH_OTP_DELIVERY_MODE: console
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APP_NAME: safarpay
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - safarpay-net

  bidding:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: bidding
    container_name: safarpay-bidding
    ports:
      - "8002:8000"
    environment:
      POSTGRES_DB_URI: postgresql+psycopg://safarpay:safarpay_secret@postgres:5432/safarpay_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      APP_NAME: safarpay
      LOG_LEVEL: INFO
      RIDE_SERVICE_URL: http://ride:8000
      VERIFICATION_SERVICE_URL: http://verification:8000
      NOTIFICATION_SERVICE_URL: http://notification:8000
      PAYMENT_SERVICE_URL: http://payment:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      payment:
        condition: service_healthy
    networks:
      - safarpay-net

  location:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: location
    container_name: safarpay-location
    ports:
      - "8003:8000"
    environment:
      POSTGRES_DB_URI: postgresql+psycopg://safarpay:safarpay_secret@postgres:5432/safarpay_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      APP_NAME: safarpay
      LOG_LEVEL: INFO
      # Location-specific tuning (overridable per environment)
      LOCATION_UPDATE_RATE_LIMIT_WINDOW: "5"
      LOCATION_UPDATE_RATE_LIMIT_MAX: "2"
      LOCATION_REDIS_TTL: "75"
      LOCATION_STALE_THRESHOLD_SECONDS: "75"
      LOCATION_MAX_SPEED_KMH: "200"
      LOCATION_MIN_ACCURACY_METERS: "50"
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - safarpay-net

  notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification
    container_name: safarpay-notification
    ports:
      - "8004:8000"
    environment:
      POSTGRES_DB_URI: postgresql+psycopg://safarpay:safarpay_secret@postgres:5432/safarpay_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      APP_NAME: safarpay
      LOG_LEVEL: INFO
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_SERVICE_ACCOUNT_JSON_BASE64: ${FCM_SERVICE_ACCOUNT_JSON_BASE64:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - safarpay-net

  verification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: verification
        PYTHON_IMAGE: python:3.10-slim-bookworm
    container_name: safarpay-verification
    ports:
      - "8005:8000"
    environment:
      POSTGRES_DB_URI: postgresql+psycopg://safarpay:safarpay_secret@postgres:5432/safarpay_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      APP_NAME: safarpay
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - safarpay-net

  geospatial:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: geospatial
    container_name: safarpay-geospatial
    ports:
      - "8006:8000"
    environment:
      POSTGRES_DB_URI: postgresql+psycopg://safarpay:safarpay_secret@postgres:5432/safarpay_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      APP_NAME: safarpay
      LOG_LEVEL: INFO
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      GEOSPATIAL_ALLOW_MOCK_ROUTING: ${GEOSPATIAL_ALLOW_MOCK_ROUTING:-false}
      LOCATION_SERVICE_URL: http://location:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - safarpay-net

  communication:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: communication
    container_name: safarpay-communication
    ports:
      - "8007:8000"
    environment:
      POSTGRES_DB_URI: postgresql+psycopg://safarpay:safarpay_secret@postgres:5432/safarpay_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      APP_NAME: safarpay
      LOG_LEVEL: INFO
      S3_COMMUNICATION_BUCKET: ${S3_COMMUNICATION_BUCKET:-safarpay-communication-media}
      WEBRTC_ICE_SERVERS_JSON: ${WEBRTC_ICE_SERVERS_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - safarpay-net

  payment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment
    container_name: safarpay-payment
    ports:
      - "8009:8000"
    environment:
      POSTGRES_DB_URI: postgresql+psycopg://safarpay:safarpay_secret@postgres:5432/safarpay_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      APP_NAME: safarpay
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - safarpay-net

  ride:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ride
    container_name: safarpay-ride
    ports:
      - "8008:8000"
    environment:
      POSTGRES_DB_URI: postgresql+psycopg://safarpay:safarpay_secret@postgres:5432/safarpay_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      APP_NAME: safarpay
      LOG_LEVEL: INFO
      GEOSPATIAL_SERVICE_URL: http://geospatial:8000
      NOTIFICATION_SERVICE_URL: http://notification:8000
      PAYMENT_SERVICE_URL: http://payment:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - safarpay-net

volumes:
  postgres_data:
  redis_data:

networks:
  safarpay-net:
    driver: bridge

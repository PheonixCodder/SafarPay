name: client
description: "A Ride Hailing App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Utility Packages
  http: ^1.6.0
  intl: ^0.20.2
  logger: ^2.7.0
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.7
  smooth_page_indicator: ^2.0.1
  pinput: ^5.0.0
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  mapbox_maps_flutter: ^2.23.0
  web_socket_channel: ^3.0.3
  connectivity_plus: ^6.1.5
  image_picker: ^1.2.1
  camera: ^0.11.3
  flutter_webrtc: ^0.14.2
  record: ^6.1.2
  audioplayers: ^6.5.1
  firebase_core: ^4.8.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0
  flutter_foreground_task: ^9.2.2
  carousel_slider: ^5.1.2
  shadcn_ui: ^0.54.0

  # Icons
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8

  # State Management
  get: ^4.7.3
  get_storage: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/icons/
    - assets/images/
    - assets/images/onboarding/
    - assets/images/banners/
    - assets/images/categories/
    - assets/images/driver/
    - assets/images/rides/
    - assets/images/support/

  fonts:
    - family: SF-Pro
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
